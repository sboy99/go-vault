# Build and test go-vault on pushes and PRs to main.

name: Go Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: go-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /tmp/go-vault ./cmd/go-vault

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: go-vault:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
