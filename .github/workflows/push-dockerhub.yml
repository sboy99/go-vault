# Publish sboy99/go-vault to Docker Hub on semver tags (vX.Y.Z).
# Also stamps ui/package.json + CLI version and commits the bump to the default branch.

name: Push Docker Hub

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: push-dockerhub-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          go build -o /tmp/go-vault ./cmd/cli
          go build -o /tmp/go-vault-server ./cmd/server

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.4.0+ binaries are built with Go 1.25 (required by go.mod)
          version: v2.4.0
          args: --timeout=5m

  version:
    name: Bump version on default branch
    needs: test
    runs-on: ubuntu-latest
    # Image publish must not wait on this; branch protection can block the push.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          raw="${GITHUB_REF_NAME}"
          ver="${raw#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=${raw}" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version files
        run: ./scripts/set-version.sh "${{ steps.ver.outputs.version }}"

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "version already at ${{ steps.ver.outputs.version }}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ui/package.json \
            ui/package-lock.json \
            internal/version/version.go \
            ui/lib/mock/fixtures.ts
          git commit -m "chore: release ${{ steps.ver.outputs.version }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  publish:
    name: Build and push to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          raw="${GITHUB_REF_NAME}"
          ver="${raw#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version into build context
        run: ./scripts/set-version.sh "${{ steps.ver.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          # Namespace matches image sboy99/go-vault (no username secret needed).
          username: sboy99
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sboy99/go-vault
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker Hub publish"
            echo ""
            echo "**Image:** \`sboy99/go-vault\`"
            echo ""
            echo "**Version:** \`${{ steps.ver.outputs.version }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
