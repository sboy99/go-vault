services:
  postgres:
    container_name: go-vault-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - go_vault_postgres_data:/var/lib/postgresql/data
    networks:
      - go_vault_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-vault:
    container_name: go-vault
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GO_VAULT_DB_HOST: postgres
      GO_VAULT_DB_PORT: "5432"
      GO_VAULT_DB_NAME: app
      GO_VAULT_DB_USERNAME: postgres
      GO_VAULT_DB_PASSWORD: postgres
      GO_VAULT_DB_TYPE: POSTGRESQL
      GO_VAULT_DB_SSLMODE: disable
      GO_VAULT_STORAGE_TYPE: LOCAL
      GO_VAULT_STORAGE_DEST: /data/backups
      GO_VAULT_RUNTIME_META_DB_PATH: /data/meta/go-vault.db
      GO_VAULT_SCHEDULE_CRON: "0 2 * * *"
      GO_VAULT_SCHEDULE_TIMEZONE: UTC
      GO_VAULT_RETENTION_DAILY: "7"
      GO_VAULT_RETENTION_WEEKLY: "4"
      GO_VAULT_RETENTION_MONTHLY: "12"
      GO_VAULT_API_ADDR: ":8080"
    volumes:
      - go_vault_backups:/data/backups
      - go_vault_meta:/data/meta
    networks:
      - go_vault_net
    ports:
      - "8080:8080"

networks:
  go_vault_net:
    name: go_vault_net
    driver: bridge

volumes:
  go_vault_postgres_data:
    name: go_vault_postgres_data
  go_vault_backups:
    name: go_vault_backups
  go_vault_meta:
    name: go_vault_meta
